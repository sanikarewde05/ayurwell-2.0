      gap: 10px;
      align-items: center;
    }

      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      background: #334155;
      color: #fff;
    }
    button.primary {
      background: #0284c7;
      border-color: #0369a1;
      color: #fff;
    }
    button.primary:hover {
      background: #0369a1;
    }
    #viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 40px;
      cursor: grab;
      background-color: #090d16;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #diagram-container {
      transform-origin: top left;
      transition: transform 0.1s ease-out;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border-radius: 14px;
      overflow: hidden;
    }
    svg {
      display: block;

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    let scale = 0.5;
    const container = document.getElementById('diagram-container');
    const viewport = document.getElementById('viewport');

    function updateTransform() {
      container.style.transform = `scale(${scale})`;
    }

    function zoomIn() {
      scale = Math.min(scale + 0.1, 2.5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale - 0.1, 0.2);
      updateTransform();
    }

    function resetZoom() {
      scale = 1.0;
      updateTransform();
    }

    function fitScreen() {
      const availWidth = viewport.clientWidth - 80;
      scale = availWidth / 3600;
      updateTransform();
    }

    window.addEventListener('load', () => {
      fitScreen();
    });

    function downloadSVG() {
      const svgData = document.querySelector('svg').outerHTML;
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ayurwell_uml_class_diagram.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgElement = document.querySelector('svg');
      const svgString = new XMLSerializer().serializeToString(svgElement);
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      canvas.width = 3600;
      canvas.height = 2420;

      img.onload = function() {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const pngURL = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngURL;
        a.download = 'ayurwell_uml_class_diagram.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = blobURL;
    }
  </script>
