  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    let scale = 0.5;
    const container = document.getElementById('diagram-container');
    const viewport = document.getElementById('viewport');

    function updateTransform() {
      container.style.transform = `scale(${scale})`;
    }

    function zoomIn() {
      scale = Math.min(scale + 0.1, 2.5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale - 0.1, 0.2);
      updateTransform();
    }

    function resetZoom() {
      scale = 1.0;
      updateTransform();
    }

    function fitScreen() {
      const availWidth = viewport.clientWidth - 80;
      scale = availWidth / 3600;
      updateTransform();
    }

    window.addEventListener('load', () => {
      fitScreen();
    });

    function downloadSVG() {
      const svgData = document.querySelector('svg').outerHTML;
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ayurwell_er_diagram.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgElement = document.querySelector('svg');
      const svgString = new XMLSerializer().serializeToString(svgElement);
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      canvas.width = 3600;
      canvas.height = 2420;

      img.onload = function() {
        ctx.fillStyle = '#080c15';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const pngURL = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngURL;
        a.download = 'ayurwell_er_diagram.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = blobURL;
    }
  </script>
