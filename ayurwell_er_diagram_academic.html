<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AyurWell — Entity Relationship Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #eef2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-bar {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #1a202c;
    }
    .badge {
      background: #2b6cb0;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .canvas-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 98vw;
      overflow: auto;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>AyurWell Healthcare Platform — Entity Relationship Diagram</h1>
    <span class="badge">15 Relational Tables • Textbook ERD Format</span>
  </div>
  <div class="canvas-container">
    <img src="ayurwell_er_diagram_academic.png" alt="AyurWell Entity Relationship Diagram" />
  </div>
</body>
</html>
